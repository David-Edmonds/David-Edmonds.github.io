name: Publish GitHub Pages export

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build, test, and generate docs
        run: npm test

      - name: Commit generated GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          git add -A docs
          if git diff --cached --quiet; then
            echo "Generated site is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pages): publish generated site [skip ci]"
          git push origin HEAD:main
