name: Live site health

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish GitHub Pages export"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: live-site-health
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check live pages, links, and résumé
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > site-health.log

          for attempt in $(seq 1 12); do
            echo "Live-site health attempt ${attempt}/12" | tee -a site-health.log
            if node scripts/check-live-site.mjs 2>&1 | tee site-health-attempt.log; then
              cat site-health-attempt.log >> site-health.log
              exit 0
            fi

            cat site-health-attempt.log >> site-health.log
            if [[ "$attempt" -lt 12 ]]; then
              echo "Deployment is not fully visible yet; retrying in 10 seconds." | tee -a site-health.log
              sleep 10
            fi
          done

          exit 1
        env:
          SITE_URL: https://david-edmonds.github.io/

      - name: Open or update a failure issue
        if: steps.live.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automated site health failure"
          issue_number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          details="$(tail -c 60000 site-health.log)"
          body=$(cat <<EOF
          The live-site check failed on $(date -u +'%Y-%m-%d %H:%M UTC').

          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          \`\`\`text
          ${details}
          \`\`\`
          EOF
          )

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a recovered failure issue
        if: steps.live.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automated site health failure"
          issue_number="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "The live-site health check recovered successfully on $(date -u +'%Y-%m-%d %H:%M UTC'). Closing this automated incident."
            gh issue close "$issue_number" --reason completed
          fi

      - name: Fail workflow when the check failed
        if: steps.live.outcome == 'failure'
        run: exit 1
