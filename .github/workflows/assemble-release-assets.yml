name: Assemble reviewed release assets

on:
  push:
    branches: [release/publish-analytics-lab]
    paths:
      - .release-assets/web-resume.b64.part-*
      - .github/workflows/assemble-release-assets.yml

permissions:
  contents: write

concurrency:
  group: assemble-release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: release/publish-analytics-lab
          fetch-depth: 0

      - name: Assemble and verify resume PDF
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.release-assets/web-resume.b64.part-*)
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No staged web resume parts remain."
            exit 0
          fi
          if [[ ${#parts[@]} -ne 2 ]]; then
            echo "Expected exactly 2 staged web resume parts; found ${#parts[@]}." >&2
            exit 1
          fi

          cat "${parts[@]}" | base64 --decode > public/david-edmonds-resume.pdf
          test "$(wc -c < public/david-edmonds-resume.pdf)" -eq 8565
          echo "f5aeff11a397bb19fe508b7f4baa2592ad79d0faf428220ff90648728d1d9d8d  public/david-edmonds-resume.pdf" | sha256sum --check --strict
          test "$(head -c 5 public/david-edmonds-resume.pdf)" = "%PDF-"

          rm -rf .release-assets
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit verified binary asset
        if: steps.assemble.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/david-edmonds-resume.pdf .release-assets
          git commit -m "chore: publish reviewed resume PDF [skip ci]"
          git push origin HEAD:release/publish-analytics-lab
